<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>VEX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-0: #000000;
            --bg-1: #030608;
            --cyan: #00e5ff;
            --cyan-bright: #4df0ff;
            --cyan-dim: #00b8cc;
            --cyan-deep: #0088a0;
            --cyan-glow: rgba(0, 229, 255, 0.7);
            --cyan-soft: rgba(0, 229, 255, 0.15);
            --white: #ffffff;
            --white-dim: #b8e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg-0);
            font-family: 'Baloo 2', 'Orbitron', sans-serif;
        }

        body {
            color: var(--white);
            display: flex;
            flex-direction: column;
            position: relative;
            isolation: isolate;
        }

        /* ============ FRAME ============ */
        .frame-wrapper {
            flex: 1;
            position: relative;
            margin: 8px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 229, 255, 0.2);
            background: var(--bg-1);
            box-shadow: 
                0 0 0 1px rgba(0, 229, 255, 0.1),
                0 20px 60px rgba(0, 0, 0, 0.9),
                0 0 100px rgba(0, 229, 255, 0.1),
                inset 0 0 80px rgba(0, 229, 255, 0.04);
            min-height: 0;
        }

        .frame-wrapper::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, 
                rgba(0, 229, 255, 0.6), 
                transparent 40%, 
                transparent 60%, 
                rgba(0, 229, 255, 0.6));
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 2;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #fff;
            position: relative;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.8s ease 0.3s;
        }

        iframe.ready {
            opacity: 1;
        }

        /* ============ LOADING SCREEN ============ */
        .loading-screen {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: 
                radial-gradient(ellipse at center, rgba(0, 229, 255, 0.08), transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(0, 229, 255, 0.05), transparent 50%),
                radial-gradient(ellipse at 0% 0%, rgba(0, 229, 255, 0.05), transparent 50%),
                #000000;
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s;
            overflow: hidden;
            direction: ltr;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ============ BACKGROUND GRID ============ */
        .grid-layer {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.08) 1px, transparent 1px);
            background-size: 45px 45px;
            mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 20%, transparent 80%);
            opacity: 0;
            animation: gridFadeIn 1s ease 0.2s forwards, gridMove 20s linear 0.2s infinite;
        }

        @keyframes gridFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 45px 45px; }
        }

        /* ============ RADIAL RINGS ============ */
        .radial-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            pointer-events: none;
            z-index: 1;
        }

        .radial-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(0, 229, 255, 0.2);
            animation: radialPulse 4s ease-out infinite;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
        }

        .radial-ring:nth-child(1) { animation-delay: 0s; }
        .radial-ring:nth-child(2) { animation-delay: 1s; }
        .radial-ring:nth-child(3) { animation-delay: 2s; }
        .radial-ring:nth-child(4) { animation-delay: 3s; }

        @keyframes radialPulse {
            0% {
                width: 80px;
                height: 80px;
                opacity: 0;
                border-width: 2px;
            }
            20% { opacity: 0.9; }
            100% {
                width: 700px;
                height: 700px;
                opacity: 0;
                border-width: 0.5px;
            }
        }

        /* ============ LOGO CONTAINER ============ */
        .logo-container {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 60px;
        }

        .neon-glow-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, 
                rgba(0, 229, 255, 0.5) 0%,
                rgba(0, 229, 255, 0.25) 30%,
                rgba(0, 229, 255, 0.1) 50%,
                transparent 70%);
            filter: blur(30px);
            opacity: 0;
            animation: glowPulse 3s ease-in-out 1.5s infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%, 100% { 
                opacity: 0.6; 
                transform: translate(-50%, -50%) scale(1);
            }
            50% { 
                opacity: 1; 
                transform: translate(-50%, -50%) scale(1.15);
            }
        }

        /* ============ VEX LETTERS ============ */
        .vex-letters {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            position: relative;
            direction: ltr;
            perspective: 1000px;
        }

        .letter {
            font-family: 'Baloo 2', 'Orbitron', sans-serif;
            font-size: 150px;
            font-weight: 800;
            line-height: 1;
            position: relative;
            display: inline-block;
            background: linear-gradient(180deg, 
                #ffffff 0%, 
                #e0faff 20%,
                #4df0ff 50%,
                #00e5ff 80%,
                #00b8cc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(80px) scale(0.3);
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.6));
        }

        .letter.v {
            animation: bubbleIn 1.4s cubic-bezier(0.34, 1.8, 0.64, 1) 0.3s forwards,
                       bubbleFloat 3s ease-in-out 1.7s infinite;
        }
        .letter.e {
            animation: bubbleIn 1.4s cubic-bezier(0.34, 1.8, 0.64, 1) 0.7s forwards,
                       bubbleFloat 3.2s ease-in-out 2.1s infinite;
        }
        .letter.x {
            animation: bubbleIn 1.4s cubic-bezier(0.34, 1.8, 0.64, 1) 1.1s forwards,
                       bubbleFloat 2.8s ease-in-out 2.5s infinite;
        }

        @keyframes bubbleIn {
            0% {
                opacity: 0;
                transform: translateY(80px) scale(0.3);
                filter: blur(15px) drop-shadow(0 0 0px transparent);
            }
            40% {
                opacity: 1;
                filter: blur(0px) drop-shadow(0 0 30px rgba(0, 229, 255, 0.9));
            }
            60% {
                transform: translateY(-15px) scale(1.15);
                filter: blur(0px) drop-shadow(0 0 40px rgba(0, 229, 255, 1));
            }
            80% {
                transform: translateY(5px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px) drop-shadow(0 0 20px rgba(0, 229, 255, 0.7));
            }
        }

        @keyframes bubbleFloat {
            0%, 100% { 
                transform: translateY(0) scale(1) rotate(0deg);
                filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.7));
            }
            25% { 
                transform: translateY(-8px) scale(1.03) rotate(-1deg);
                filter: drop-shadow(0 0 30px rgba(0, 229, 255, 0.9));
            }
            50% { 
                transform: translateY(-3px) scale(1.05) rotate(1deg);
                filter: drop-shadow(0 0 35px rgba(0, 229, 255, 1));
            }
            75% { 
                transform: translateY(-10px) scale(1.02) rotate(-0.5deg);
                filter: drop-shadow(0 0 28px rgba(0, 229, 255, 0.85));
            }
        }

        .letter::before {
            content: attr(data-letter);
            position: absolute;
            top: 5%;
            left: 20%;
            right: 20%;
            font-family: 'Baloo 2', 'Orbitron', sans-serif;
            font-size: 150px;
            font-weight: 800;
            background: linear-gradient(180deg, 
                rgba(255, 255, 255, 0.9) 0%,
                rgba(255, 255, 255, 0.3) 40%,
                transparent 60%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            pointer-events: none;
            z-index: 2;
            filter: blur(1px);
        }

        .letter::after {
            content: attr(data-letter);
            position: absolute;
            top: 0;
            left: 0;
            font-family: 'Baloo 2', 'Orbitron', sans-serif;
            font-size: 150px;
            font-weight: 800;
            color: var(--cyan);
            -webkit-text-fill-color: var(--cyan);
            background: none;
            filter: blur(25px);
            z-index: -1;
            opacity: 0;
            animation: glowFadeIn 1s ease 1.5s forwards;
        }

        @keyframes glowFadeIn {
            0% { opacity: 0; }
            100% { opacity: 0.95; }
        }

        /* ============ LIGHTNING ============ */
        .lightning {
            position: absolute;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
        }

        .lightning::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, 
                    transparent 0%,
                    transparent 45%,
                    var(--cyan) 48%,
                    #ffffff 50%,
                    var(--cyan) 52%,
                    transparent 55%,
                    transparent 100%);
            filter: blur(1px);
        }

        .bolt-1 {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            animation: lightningStrike 3s ease-in-out infinite;
            animation-delay: 2s;
        }

        .bolt-2 {
            top: 20%;
            left: 20%;
            width: 200px;
            height: 250px;
            animation: lightningStrike 4s ease-in-out infinite;
            animation-delay: 3.5s;
            transform: rotate(-30deg);
        }

        .bolt-3 {
            top: 15%;
            right: 20%;
            width: 200px;
            height: 250px;
            animation: lightningStrike 3.5s ease-in-out infinite;
            animation-delay: 5s;
            transform: rotate(35deg);
        }

        @keyframes lightningStrike {
            0%, 88%, 100% {
                opacity: 0;
                filter: blur(2px);
            }
            89% {
                opacity: 1;
                filter: blur(0px) brightness(2);
            }
            90% { opacity: 0; }
            91% {
                opacity: 1;
                filter: blur(0px) brightness(2.5);
            }
            92% { opacity: 0; }
            93% {
                opacity: 0.8;
                filter: blur(0.5px) brightness(2);
            }
            94% { opacity: 0; }
        }

        .lightning-path {
            position: absolute;
            pointer-events: none;
            z-index: 19;
            opacity: 0;
            filter: drop-shadow(0 0 8px var(--cyan)) drop-shadow(0 0 20px var(--cyan));
        }

        .lightning-path svg {
            width: 100%;
            height: 100%;
        }

        .lightning-path path {
            fill: none;
            stroke: var(--cyan);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 6px var(--cyan));
        }

        .path-1 {
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 400px;
            animation: pathStrike 4s ease-in-out infinite 2.5s;
        }

        .path-2 {
            top: 50px;
            left: -30px;
            width: 150px;
            height: 300px;
            transform: rotate(-25deg);
            animation: pathStrike 5s ease-in-out infinite 4s;
        }

        .path-3 {
            top: 30px;
            right: -30px;
            width: 150px;
            height: 300px;
            transform: rotate(25deg);
            animation: pathStrike 4.5s ease-in-out infinite 5.5s;
        }

        @keyframes pathStrike {
            0%, 90%, 100% {
                opacity: 0;
                transform: var(--base-transform, translateX(-50%)) scaleY(0.8);
            }
            91% {
                opacity: 1;
                transform: var(--base-transform, translateX(-50%)) scaleY(1);
            }
            92% {
                opacity: 0.3;
                transform: var(--base-transform, translateX(-50%)) scaleY(1.05);
            }
            93% {
                opacity: 1;
                transform: var(--base-transform, translateX(-50%)) scaleY(1);
            }
            94% { opacity: 0; }
        }

        .path-2 { --base-transform: rotate(-25deg); }
        .path-3 { --base-transform: rotate(25deg); }

        .arc-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 8;
        }

        .arc {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 
                0 0 10px #ffffff,
                0 0 20px var(--cyan),
                0 0 35px var(--cyan);
            opacity: 0;
            animation: arcFlash 2s ease-in-out infinite;
        }

        .arc:nth-child(1) { top: 10%; left: 15%; animation-delay: 2s; }
        .arc:nth-child(2) { top: 80%; left: 85%; animation-delay: 2.3s; }
        .arc:nth-child(3) { top: 90%; left: 20%; animation-delay: 2.6s; }
        .arc:nth-child(4) { top: 15%; left: 80%; animation-delay: 2.9s; }
        .arc:nth-child(5) { top: 50%; left: 5%; animation-delay: 3.2s; }
        .arc:nth-child(6) { top: 50%; right: 5%; animation-delay: 3.5s; }
        .arc:nth-child(7) { top: 5%; left: 50%; animation-delay: 3.8s; }
        .arc:nth-child(8) { bottom: 5%; left: 50%; animation-delay: 4.1s; }

        @keyframes arcFlash {
            0%, 80%, 100% { opacity: 0; transform: scale(0.5); }
            85% { opacity: 1; transform: scale(1.5); }
            90% { opacity: 0.5; transform: scale(1); }
            95% { opacity: 1; transform: scale(1.3); }
        }

        .screen-flash {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, 
                rgba(0, 229, 255, 0.4) 0%,
                transparent 60%);
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            animation: screenFlash 5s ease-in-out infinite;
            animation-delay: 2s;
        }

        @keyframes screenFlash {
            0%, 88%, 100% { opacity: 0; }
            89% { opacity: 0.6; }
            90% { opacity: 0; }
            91% { opacity: 0.8; }
            92% { opacity: 0; }
            93% { opacity: 0.4; }
            94% { opacity: 0; }
        }

        /* ============ LOGO LINE ============ */
        .logo-line {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 340px;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--cyan), 
                #ffffff,
                var(--cyan),
                transparent);
            box-shadow: 
                0 0 15px var(--cyan),
                0 0 30px var(--cyan),
                0 0 60px var(--cyan);
            animation: lineExpand 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
        }

        @keyframes lineExpand {
            0% { 
                transform: translateX(-50%) scaleX(0); 
                opacity: 0;
            }
            100% { 
                transform: translateX(-50%) scaleX(1); 
                opacity: 1;
            }
        }

        /* ============ LOADING INFO ============ */
        .loading-info {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            opacity: 0;
            animation: infoFadeIn 1s ease 2.5s forwards;
            direction: ltr;
        }

        @keyframes infoFadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ============ BUBBLE PERCENTAGE ============ */
        .percent-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            direction: ltr;
            position: relative;
            perspective: 800px;
        }

        .percent-num {
            font-family: 'Baloo 2', 'Orbitron', sans-serif;
            font-size: 76px;
            font-weight: 800;
            line-height: 1;
            position: relative;
            display: inline-block;
            background: linear-gradient(180deg, 
                #ffffff 0%, 
                #e0faff 20%,
                #4df0ff 50%,
                #00e5ff 80%,
                #00b8cc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-variant-numeric: tabular-nums;
            min-width: 130px;
            text-align: right;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.7))
                    drop-shadow(0 0 30px rgba(0, 229, 255, 0.4));
            animation: percentFloat 3s ease-in-out infinite;
            letter-spacing: 1px;
        }

        /* Bubble inner highlight */
        .percent-num::before {
            content: attr(data-value);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            font-family: 'Baloo 2', 'Orbitron', sans-serif;
            font-size: 76px;
            font-weight: 800;
            letter-spacing: 1px;
            text-align: right;
            background: linear-gradient(180deg, 
                rgba(255, 255, 255, 0.95) 0%,
                rgba(255, 255, 255, 0.4) 25%,
                transparent 50%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            pointer-events: none;
            filter: blur(0.8px);
        }

        @keyframes percentFloat {
            0%, 100% { 
                transform: translateY(0) scale(1) rotate(0deg);
                filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.7))
                        drop-shadow(0 0 30px rgba(0, 229, 255, 0.4));
            }
            25% { 
                transform: translateY(-5px) scale(1.03) rotate(-0.5deg);
                filter: drop-shadow(0 0 22px rgba(0, 229, 255, 0.9))
                        drop-shadow(0 0 45px rgba(0, 229, 255, 0.6));
            }
            50% { 
                transform: translateY(-2px) scale(1.05) rotate(0.5deg);
                filter: drop-shadow(0 0 28px rgba(0, 229, 255, 1))
                        drop-shadow(0 0 55px rgba(0, 229, 255, 0.7));
            }
            75% { 
                transform: translateY(-7px) scale(1.02) rotate(-0.3deg);
                filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.85))
                        drop-shadow(0 0 40px rgba(0, 229, 255, 0.5));
            }
        }

        /* Pop animation when number changes */
        .percent-num.pop {
            animation: percentPop 0.35s cubic-bezier(0.34, 1.8, 0.64, 1),
                       percentFloat 3s ease-in-out 0.35s infinite;
        }

        @keyframes percentPop {
            0% { 
                transform: scale(1.35) rotate(-3deg);
                filter: drop-shadow(0 0 35px rgba(0, 229, 255, 1))
                        drop-shadow(0 0 70px rgba(0, 229, 255, 0.8));
            }
            50% { 
                transform: scale(0.92) rotate(2deg);
            }
            100% { 
                transform: scale(1) rotate(0deg);
            }
        }

        /* Glow around percent */
        .percent-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, 
                rgba(0, 229, 255, 0.35) 0%,
                rgba(0, 229, 255, 0.15) 40%,
                transparent 70%);
            filter: blur(25px);
            z-index: -1;
            pointer-events: none;
            animation: percentGlowPulse 2s ease-in-out infinite;
        }

        @keyframes percentGlowPulse {
            0%, 100% { 
                opacity: 0.7; 
                transform: translate(-50%, -50%) scale(1);
            }
            50% { 
                opacity: 1; 
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        /* Percent symbol */
        .percent-symbol {
            font-family: 'Baloo 2', 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(180deg, 
                #ffffff 0%,
                #4df0ff 50%,
                #00e5ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.9))
                    drop-shadow(0 0 25px rgba(0, 229, 255, 0.5));
            animation: percentFloat 3.2s ease-in-out 0.3s infinite;
            align-self: flex-start;
            margin-top: 8px;
        }

        /* Status text */
        .status-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 8px;
            color: var(--white-dim);
            font-weight: 500;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 14px;
            height: 16px;
            direction: ltr;
        }

        .status-text::before,
        .status-text::after {
            content: '';
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--cyan-dim), transparent);
            box-shadow: 0 0 8px var(--cyan);
        }

        /* ============ SUPER BUBBLE PROGRESS BAR ============ */
        .bar-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .bar-track {
            width: 340px;
            max-width: 80vw;
            height: 8px;
            background: rgba(0, 229, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 
                inset 0 0 12px rgba(0, 0, 0, 0.9),
                inset 0 0 20px rgba(0, 229, 255, 0.15),
                0 0 25px rgba(0, 229, 255, 0.15);
            border: 1px solid rgba(0, 229, 255, 0.15);
        }

        /* Animated shine across track */
        .bar-track::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, 
                transparent,
                rgba(0, 229, 255, 0.15),
                transparent);
            animation: trackShine 3s linear infinite;
            pointer-events: none;
            z-index: 3;
        }

        @keyframes trackShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Diagonal stripes overlay on track */
        .bar-track::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 8px,
                rgba(0, 229, 255, 0.05) 8px,
                rgba(0, 229, 255, 0.05) 16px
            );
            animation: stripesMove 1s linear infinite;
            pointer-events: none;
            z-index: 2;
            opacity: 0.5;
        }

        @keyframes stripesMove {
            0% { background-position: 0 0; }
            100% { background-position: 32px 0; }
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, 
                var(--cyan-deep), 
                var(--cyan), 
                #ffffff,
                var(--cyan));
            background-size: 200% 100%;
            border-radius: 20px;
            box-shadow: 
                0 0 15px var(--cyan),
                0 0 35px var(--cyan-glow),
                0 0 60px var(--cyan-glow);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: barFlow 2s linear infinite;
            position: relative;
            z-index: 1;
            overflow: visible;
        }

        @keyframes barFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* Bubble head on bar */
        .bar-fill::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%,
                #ffffff 0%,
                #a8f5ff 30%,
                var(--cyan) 60%,
                var(--cyan-dim) 100%);
            box-shadow: 
                0 0 20px #ffffff,
                0 0 35px var(--cyan),
                0 0 55px var(--cyan),
                0 0 80px var(--cyan-glow),
                inset -3px -3px 8px rgba(0, 0, 0, 0.3),
                inset 3px 3px 8px rgba(255, 255, 255, 0.5);
            opacity: 0;
            transition: opacity 0.3s ease;
            animation: bubbleHeadFloat 1.5s ease-in-out infinite;
        }

        /* Bubble inner highlight */
        .bar-fill::before {
            content: '';
            position: absolute;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.95), 
                transparent 70%);
            filter: blur(0.5px);
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .bar-fill.active::after {
            opacity: 1;
        }

        .bar-fill.active::before {
            opacity: 1;
        }

        @keyframes bubbleHeadFloat {
            0%, 100% { 
                transform: translateY(-50%) scale(1);
                box-shadow: 
                    0 0 20px #ffffff,
                    0 0 35px var(--cyan),
                    0 0 55px var(--cyan),
                    0 0 80px var(--cyan-glow),
                    inset -3px -3px 8px rgba(0, 0, 0, 0.3),
                    inset 3px 3px 8px rgba(255, 255, 255, 0.5);
            }
            50% { 
                transform: translateY(-50%) scale(1.2);
                box-shadow: 
                    0 0 30px #ffffff,
                    0 0 50px var(--cyan),
                    0 0 80px var(--cyan),
                    0 0 120px var(--cyan-glow),
                    inset -3px -3px 8px rgba(0, 0, 0, 0.3),
                    inset 3px 3px 8px rgba(255, 255, 255, 0.5);
            }
        }

        /* Bubbles trail behind the head */
        .bubble-trail {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                #ffffff,
                var(--cyan) 60%,
                transparent);
            box-shadow: 
                0 0 8px var(--cyan),
                0 0 15px var(--cyan);
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        .bar-fill.active .bubble-trail {
            animation: trailFade 1.2s ease-in-out infinite;
        }

        @keyframes trailFade {
            0% { 
                opacity: 0.9; 
                transform: translateY(-50%) scale(1);
            }
            100% { 
                opacity: 0; 
                transform: translateY(-50%) scale(0.3) translateX(-15px);
            }
        }

        /* Bar reflection */
        .bar-reflection {
            position: relative;
            width: 340px;
            max-width: 80vw;
            height: 6px;
            background: linear-gradient(180deg,
                rgba(0, 229, 255, 0.15),
                transparent);
            border-radius: 0 0 20px 20px;
            filter: blur(3px);
            margin-top: -3px;
            opacity: 0.6;
        }

        /* ============ NOISE OVERLAY ============ */
        .noise {
            position: absolute;
            inset: 0;
            z-index: 3;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* ============ SPARKS ============ */
        .sparks {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 7;
            overflow: hidden;
        }

        .spark {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 
                0 0 8px #ffffff,
                0 0 15px var(--cyan),
                0 0 25px var(--cyan);
            opacity: 0;
            animation: sparkRise linear infinite;
        }

        @keyframes sparkRise {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.5);
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                opacity: 0;
                transform: translateY(-300px) scale(0);
            }
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 640px) {
            .frame-wrapper {
                margin: 6px;
                border-radius: 14px;
            }

            .letter,
            .letter::before,
            .letter::after {
                font-size: 100px;
            }

            .neon-glow-bg {
                width: 350px;
                height: 180px;
            }

            .logo-container {
                margin-bottom: 45px;
            }

            .logo-line {
                width: 240px;
                bottom: -28px;
            }

            .percent-num,
            .percent-num::before {
                font-size: 56px;
                min-width: 100px;
            }

            .percent-glow {
                width: 180px;
                height: 90px;
            }

            .percent-symbol {
                font-size: 24px;
            }

            .bar-track,
            .bar-reflection {
                width: 250px;
                height: 7px;
            }

            .bar-fill::after {
                width: 18px;
                height: 18px;
                right: -8px;
            }

            .bar-fill::before {
                width: 6px;
                height: 6px;
            }

            .status-text {
                font-size: 9px;
                letter-spacing: 5px;
            }

            .status-text::before,
            .status-text::after {
                width: 25px;
            }

            .radial-bg {
                width: 400px;
                height: 400px;
            }

            @keyframes radialPulse {
                0% { width: 50px; height: 50px; opacity: 0; border-width: 2px; }
                20% { opacity: 0.9; }
                100% { width: 400px; height: 400px; opacity: 0; border-width: 0.5px; }
            }

            .bolt-1, .bolt-2, .bolt-3 { width: 150px; height: 150px; }
            .path-1 { width: 130px; height: 280px; }
            .path-2, .path-3 { width: 100px; height: 200px; }
        }

        @media (max-width: 380px) {
            .letter,
            .letter::before,
            .letter::after {
                font-size: 78px;
            }
            .percent-num,
            .percent-num::before {
                font-size: 44px;
                min-width: 80px;
            }
            .percent-symbol {
                font-size: 20px;
            }
        }

        .frame-wrapper {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="frame-wrapper" id="frameWrapper">
        <div class="loading-screen" id="loadingScreen">
            <!-- Background grid -->
            <div class="grid-layer"></div>

            <!-- Noise -->
            <div class="noise"></div>

            <!-- Radial pulse rings -->
            <div class="radial-bg">
                <div class="radial-ring"></div>
                <div class="radial-ring"></div>
                <div class="radial-ring"></div>
                <div class="radial-ring"></div>
            </div>

            <!-- Scan line -->
            <div class="scan-line"></div>

            <!-- Screen flash for lightning -->
            <div class="screen-flash"></div>

            <!-- Lightning paths -->
            <div class="lightning-path path-1">
                <svg viewBox="0 0 100 400" preserveAspectRatio="none">
                    <path d="M50 0 L45 40 L55 60 L40 110 L52 130 L38 180 L48 200 L35 250 L45 270 L30 320 L50 340 L40 400" />
                </svg>
            </div>
            <div class="lightning-path path-2">
                <svg viewBox="0 0 100 300" preserveAspectRatio="none">
                    <path d="M50 0 L40 30 L55 55 L42 90 L58 120 L45 160 L60 190 L48 230 L62 260 L50 300" />
                </svg>
            </div>
            <div class="lightning-path path-3">
                <svg viewBox="0 0 100 300" preserveAspectRatio="none">
                    <path d="M50 0 L60 30 L45 55 L58 90 L42 120 L55 160 L40 190 L52 230 L38 260 L50 300" />
                </svg>
            </div>

            <!-- Lightning bolts -->
            <div class="lightning bolt-1"></div>
            <div class="lightning bolt-2"></div>
            <div class="lightning bolt-3"></div>

            <!-- Sparks -->
            <div class="sparks" id="sparks"></div>

            <!-- VEX LOGO -->
            <div class="logo-container">
                <div class="neon-glow-bg"></div>

                <div class="vex-letters">
                    <span class="letter v" data-letter="V">V</span>
                    <span class="letter e" data-letter="E">E</span>
                    <span class="letter x" data-letter="X">X</span>

                    <div class="arc-container">
                        <div class="arc"></div>
                        <div class="arc"></div>
                        <div class="arc"></div>
                        <div class="arc"></div>
                        <div class="arc"></div>
                        <div class="arc"></div>
                        <div class="arc"></div>
                        <div class="arc"></div>
                    </div>
                </div>
                <div class="logo-line"></div>
            </div>

            <!-- Loading info -->
            <div class="loading-info">
                <div class="percent-wrap">
                    <div class="percent-glow"></div>
                    <span class="percent-num" id="percentNum" data-value="0">0</span>
                    <span class="percent-symbol">%</span>
                </div>
                <div class="status-text" id="statusText">INITIALIZING</div>
                <div class="bar-container">
                    <div class="bar-track">
                        <div class="bar-fill" id="barFill">
                            <div class="bubble-trail" style="right: 20px; animation-delay: 0.1s;"></div>
                            <div class="bubble-trail" style="right: 30px; animation-delay: 0.3s;"></div>
                            <div class="bubble-trail" style="right: 15px; animation-delay: 0.5s;"></div>
                        </div>
                    </div>
                    <div class="bar-reflection"></div>
                </div>
            </div>
        </div>

        <iframe 
            id="frame"
            title="Portal"
            loading="eager"
            referrerpolicy="no-referrer"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals"
            allow="clipboard-write; encrypted-media; fullscreen"
            onload="onFrameLoad()">
        </iframe>
    </div>

    <script>
        (function() {
            const _p1 = 'aHR0cHM6Ly92';
            const _p2 = 'ZXh0ZWxib3QuZ2l0';
            const _p3 = 'aHViLmlvL3ZleC8=';
            
            const _d = function(s) {
                try {
                    return decodeURIComponent(escape(atob(s)));
                } catch(e) {
                    return atob(s);
                }
            };
            
            const _url = _d(_p1) + _d(_p2) + _d(_p3);
            
            window.addEventListener('DOMContentLoaded', function() {
                const frame = document.getElementById('frame');
                setTimeout(function() {
                    frame.src = _url;
                }, 50);
            });
            
            Object.defineProperty(HTMLIFrameElement.prototype, 'src', {
                get: function() { return ''; },
                configurable: false
            });
        })();

        /* ============ SPARKS ============ */
        (function createSparks() {
            const container = document.getElementById('sparks');
            for (let i = 0; i < 25; i++) {
                const s = document.createElement('div');
                s.className = 'spark';
                s.style.left = Math.random() * 100 + '%';
                s.style.bottom = '0%';
                s.style.animationDuration = (3 + Math.random() * 4) + 's';
                s.style.animationDelay = (1 + Math.random() * 5) + 's';
                s.style.width = s.style.height = (2 + Math.random() * 2) + 'px';
                container.appendChild(s);
            }
        })();

        const frame = document.getElementById('frame');
        const loadingScreen = document.getElementById('loadingScreen');
        const barFill = document.getElementById('barFill');
        const percentNum = document.getElementById('percentNum');
        const statusText = document.getElementById('statusText');

        const statusMessages = [
            'INITIALIZING',
            'CONNECTING',
            'DECRYPTING',
            'LOADING',
            'FINALIZING'
        ];

        let progress = 0;
        let msgIndex = 0;
        let lastDisplayedPercent = 0;

        const MIN_LOADING_TIME = 7000;
        const loadingStartTime = Date.now();

        function updatePercentDisplay(value) {
            const newPercent = Math.floor(value);
            if (newPercent !== lastDisplayedPercent) {
                percentNum.textContent = newPercent;
                percentNum.setAttribute('data-value', newPercent);
                
                // Pop animation on change
                percentNum.classList.remove('pop');
                void percentNum.offsetWidth;
                percentNum.classList.add('pop');
                
                lastDisplayedPercent = newPercent;
            }
        }

        const progressInterval = setInterval(() => {
            if (progress < 95) {
                const increment = progress < 30 ? Math.random() * 6 :
                                 progress < 70 ? Math.random() * 3 :
                                 progress < 88 ? Math.random() * 1.5 :
                                 Math.random() * 0.8;
                progress += increment;
                if (progress > 95) progress = 95;
                
                barFill.style.width = progress + '%';
                barFill.classList.add('active');
                updatePercentDisplay(progress);
                
                const newIndex = Math.min(
                    Math.floor(progress / (100 / statusMessages.length)),
                    statusMessages.length - 1
                );
                if (newIndex !== msgIndex) {
                    msgIndex = newIndex;
                    statusText.textContent = statusMessages[msgIndex];
                }
            }
        }, 250);

        let frameLoaded = false;
        let loadingFinished = false;

        function finishLoading() {
            if (loadingFinished) return;
            loadingFinished = true;
            clearInterval(progressInterval);
            progress = 100;
            barFill.style.width = '100%';
            updatePercentDisplay(100);
            statusText.textContent = 'READY';
            
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                setTimeout(() => {
                    frame.classList.add('ready');
                }, 200);
            }, 1000);
        }

        function tryFinish() {
            if (!frameLoaded) return;
            const elapsed = Date.now() - loadingStartTime;
            const remaining = Math.max(0, MIN_LOADING_TIME - elapsed);
            
            if (remaining > 0) {
                setTimeout(finishLoading, remaining);
            } else {
                finishLoading();
            }
        }

        function onFrameLoad() {
            frameLoaded = true;
            tryFinish();
        }

        setTimeout(() => {
            if (!loadingFinished) {
                finishLoading();
            }
        }, 12000);

        let lastTouch = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouch <= 300) {
                e.preventDefault();
            }
            lastTouch = now;
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12') e.preventDefault();
            if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) e.preventDefault();
            if (e.ctrlKey && e.key.toLowerCase() === 'u') e.preventDefault();
        });
    </script>

</body>
</html>
